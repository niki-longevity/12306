spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml
    #  datasource:
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    #    url: jdbc:mysql://localhost:3306/db_12306?rewriteBatchedStatements=true&sessionVariables=unique_checks=0,foreign_key_checks=0
    #    username: ${MYSQL_USER}
    #    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
#      connection-timeout: 30000
#      idle-timeout: 600000
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    default-executor-type: simple
  mapper-locations: classpath*:/mapper/*.xml


rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ticket-group1
    send-message-timeout: 3000


server:
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 100


