server:
  port: 8080

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=0
        # Ticket Service
        - id: ticket-service
          uri: http://localhost:8092
          predicates:
            - Path=/ticket/**
          filters:
            - StripPrefix=0
        # Order Service
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=0
